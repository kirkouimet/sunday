name: CI

on:
  push:
  pull_request:

# A newer push makes older runs on the same branch pointless (macOS minutes add up).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test SundayKit
        run: swift test --package-path Packages/SundayKit

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app
        run: |
          xcodebuild build \
            -project Sunday.xcodeproj \
            -scheme Sunday \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    runs-on: macos-15
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]; \
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; print(c[-1]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Capture screenshots
        run: |
          xcodebuild test \
            -project Sunday.xcodeproj \
            -scheme Sunday \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath Screenshots.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Report test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path Screenshots.xcresult --compact > tests.json
          python3 - <<'PY'
          import json
          def walk(node, path):
              name = node.get('name', '')
              if node.get('nodeType') == 'Failure Message':
                  print('FAIL', path, '::', name)
              for child in node.get('children', []):
                  walk(child, path + '/' + name)
          for test in json.load(open('tests.json')).get('testNodes', []):
              walk(test, '')
          PY

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path Screenshots.xcresult --output-path shots
          cd shots
          # Name files after the attachment names from the manifest.
          python3 - <<'PY'
          import json, os
          for test in json.load(open('manifest.json')):
              for a in test.get('attachments', []):
                  src = a['exportedFileName']
                  name = a.get('suggestedHumanReadableName', src)
                  base = os.path.splitext(name)[0].split('_')[0]
                  if os.path.exists(src):
                      os.rename(src, base + '.png')
          PY
          ls -la

      - name: Publish screenshots to ci-screenshots branch
        if: always()
        run: |
          cd shots
          rm -f manifest.json
          git init -q
          git checkout -q -b ci-screenshots
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -q -m "Screenshots for ${GITHUB_SHA}" || exit 0
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
