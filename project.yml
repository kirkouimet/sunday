name: Sunday
options:
  bundleIdPrefix: cooking.sunday
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "6YC8868VS9" # Kirk Ouimet (organization)
packages:
  SundayKit:
    path: Packages/SundayKit
targets:
  Sunday:
    type: application
    platform: iOS
    sources:
      - path: Sunday
      - path: Shared
    dependencies:
      - package: SundayKit
      - target: SundayWidget
    entitlements:
      path: Sunday/Sunday.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cooking.sunday.Sunday
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cooking.sunday.Sunday
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: Sunday/Info.plist
      properties:
        CFBundleDisplayName: Sunday
        CKSharingSupported: true
        CFBundleURLTypes:
          - CFBundleURLName: cooking.sunday.Sunday
            CFBundleURLSchemes:
              - sunday
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Sunday uses the camera to take pictures of family dinners.
        NSMicrophoneUsageDescription: Sunday records the cook telling how they make a family recipe.
        NSSpeechRecognitionUsageDescription: Sunday turns recorded recipes into text on your iPhone so you can read and search them.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cooking.sunday.Sunday
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
  SundayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SundayWidget
      - path: Shared
    dependencies:
      - package: SundayKit
    entitlements:
      path: SundayWidget/SundayWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cooking.sunday.Sunday
    info:
      path: SundayWidget/Info.plist
      properties:
        CFBundleDisplayName: Sunday
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cooking.sunday.Sunday.widget
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  SundayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SundayUITests
    dependencies:
      - target: Sunday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cooking.sunday.Sunday.uitests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
schemes:
  Sunday:
    build:
      targets:
        Sunday: all
        SundayUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SundayUITests
